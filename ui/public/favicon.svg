<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="70%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#5c677d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="url(#bg)"/>

  <!-- Circular arrow -->
  <path d="M16 4 A12 12 0 1 1 5.5 20" fill="none" stroke="url(#arrow)" stroke-width="2" stroke-linecap="round"/>

  <!-- Arrow heads -->
  <polygon points="16,2 18.5,6 13.5,6" fill="#00b4d8"/>
  <polygon points="5.5,22 3,18 8,18" fill="#5c677d"/>

  <!-- Z letter with circuit pattern -->
  <g fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Z shape -->
    <path d="M10 9 L22 9 L10 23 L22 23"/>

    <!-- Circuit traces -->
    <path d="M13 9 L13 11" stroke="#00b4d8" stroke-width="1"/>
    <path d="M19 9 L19 12 L17 14" stroke="#00b4d8" stroke-width="1"/>
    <path d="M12 23 L12 20 L14 18" stroke="#00b4d8" stroke-width="1"/>
    <path d="M18 23 L18 21" stroke="#00b4d8" stroke-width="1"/>
  </g>

  <!-- Circuit nodes -->
  <circle cx="13" cy="9" r="1.2" fill="#0d1b2a" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="19" cy="9" r="1.2" fill="#0d1b2a" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="17" cy="14" r="1" fill="#00b4d8"/>
  <circle cx="14" cy="18" r="1" fill="#00b4d8"/>
  <circle cx="12" cy="23" r="1.2" fill="#0d1b2a" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="18" cy="23" r="1.2" fill="#0d1b2a" stroke="#ffffff" stroke-width="0.8"/>
</svg>
